<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>教师管理 - DataTutor</title>
<script src="https://cdn.tailwindcss.com">








</script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js">








</script>
<script src="/static/js/api.js">








</script>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden">
<style>
  .course-card { transition: all 0.2s ease; }
  .course-card:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
  .subtask-item { transition: all 0.15s ease; }
  .subtask-item:hover { border-color: #a5b4fc; }
</style>
<div class="flex w-full h-full">

<!-- ===== LEFT SIDEBAR ===== -->
<aside class="w-[220px] bg-white border-r border-slate-200 flex flex-col flex-none shadow-sm">
  <!-- Logo -->
  <div class="flex-none px-4 py-3 border-b border-slate-100 flex items-center gap-2">
    <img alt="DataTutor" class="w-7 h-7 rounded-lg" src="/static/img/logo-datatutor.png"/>
    <span class="text-sm font-bold text-slate-800">DataTutor</span>
  </div>
  <!-- Class header -->
  <div class="flex-none p-4 flex items-center justify-between">
    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">班级管理</span>
    <button class="p-1 text-indigo-500 hover:bg-indigo-50 rounded transition-colors" onclick="my_showCreateClass()">
      <iconify-icon icon="lucide:plus-circle" class="text-base"></iconify-icon>
    </button>
  </div>
  <div class="flex-1 overflow-y-auto p-2 space-y-1" id="class-list">
    <p class="text-xs text-slate-400 text-center py-8">加载中...</p>
  </div>
</aside>

<!-- ===== MAIN ===== -->
<main class="flex-1 flex flex-col overflow-hidden">
  <!-- Top bar -->
  <header class="flex-none h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 shadow-sm">
    <h1 class="text-sm font-bold text-slate-700" id="top-title">DataTutor 教师工作台</h1>
    <div class="flex items-center gap-3">
      <div class="relative" id="teacher-menu-wrap">
        <div class="flex items-center gap-2 cursor-pointer hover:bg-slate-50 rounded-full px-2 py-1 transition-colors" onclick="my_toggleMenu()">
          <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-xs font-bold text-indigo-600" id="teacher-avatar">教</div>
          <span class="text-sm font-medium text-slate-600" id="teacher-name">教师</span>
          <iconify-icon class="text-slate-400 text-xs" icon="lucide:chevron-down"></iconify-icon>
        </div>
        <div class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-1 z-50" id="teacher-menu">
          <div class="px-4 py-3 border-b border-slate-100">
            <div class="text-sm font-semibold text-slate-800" id="menu-fullname">教师</div>
            <div class="text-xs text-slate-400 mt-0.5" id="menu-role">教师</div>
            <div class="text-xs text-slate-400 mt-0.5" id="menu-tid">—</div>
          </div>
          <button class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 flex items-center gap-2" onclick="my_showProfile()"><iconify-icon icon="lucide:user" class="text-slate-400"></iconify-icon> 个人信息</button>
          <button class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 flex items-center gap-2" onclick="my_logout()"><iconify-icon icon="lucide:log-out" class="text-slate-400"></iconify-icon> 退出登录</button>
        </div>
      </div>
    </div>
  </header>
  <!-- Empty state -->
  <div class="flex-1 flex items-center justify-center" id="empty-state">
    <div class="text-center">
      <div class="w-20 h-20 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <iconify-icon class="text-indigo-400 text-3xl" icon="lucide:graduation-cap"></iconify-icon>
      </div>
      <p class="text-slate-500 text-sm">选择左侧班级或点击 + 创建新班级</p>
    </div>
  </div>

  <!-- Detail -->
  <div class="flex-1 flex flex-col overflow-hidden hidden" id="detail-panel">
    <!-- Header -->
    <div class="flex-none px-6 py-3 bg-white border-b border-slate-200 flex items-center justify-between">
      <h1 class="text-base font-bold text-slate-800" id="detail-title">班级详情</h1>
      <div class="flex gap-2">
        <button class="px-3 py-1.5 bg-emerald-500 text-white text-xs rounded-lg hover:bg-emerald-600" onclick="my_showCreateCourse()">+ 创建课程</button>
        <button class="px-3 py-1.5 bg-indigo-500 text-white text-xs rounded-lg hover:bg-indigo-600" onclick="my_showAssign()">分配课程</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex-none flex border-b border-slate-200 bg-white px-6">
      <button class="tab-btn px-4 py-3 text-sm font-semibold text-slate-600 border-b-2 border-indigo-500 text-indigo-600" data-tab="courses" onclick="my_switchTab('courses')">课程管理</button>
      <button class="tab-btn px-4 py-3 text-sm font-semibold text-slate-600" data-tab="analytics" onclick="my_switchTab('analytics')">学情分析</button>
    </div>

    <!-- Tab: 课程管理 -->
    <div class="flex-1 overflow-y-auto" id="tab-courses">
      <!-- Class course list -->
      <div class="px-6 pt-4 pb-2" id="class-courses-area"></div>
      <!-- Subtask detail -->
      <div class="hidden" id="subtask-detail">
        <div class="px-6 py-4">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-slate-800" id="subtask-course-name"></h2>
            <div class="flex gap-2">
              <button class="px-3 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700" onclick="my_showAddSubtask()"><iconify-icon class="mr-1 align-middle" icon="lucide:plus"></iconify-icon>添加子任务</button>
            </div>
          </div>
          <div class="space-y-2" id="subtask-list"></div>
        </div>
      </div>
    </div>

    <!-- Tab: 学情分析 -->
    <div class="flex-1 overflow-y-auto p-6 hidden" id="tab-analytics">
      <div class="flex items-center gap-4 mb-6">
        <h2 class="text-lg font-bold text-slate-800">学情分析</h2>
        <select class="px-3 py-2 border border-slate-200 rounded-xl text-sm text-slate-600" id="analytics-course-select" onchange="my_loadAnalytics()">
          <option value="">请选择课程</option>
        </select>
      </div>
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-white border border-slate-200 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-indigo-600" id="ana-students">0</div><div class="text-xs text-slate-500 mt-1">班级人数</div></div>
        <div class="bg-white border border-slate-200 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-emerald-600" id="ana-avg">0</div><div class="text-xs text-slate-500 mt-1">人均任务</div></div>
        <div class="bg-white border border-slate-200 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-amber-600" id="ana-rate">0%</div><div class="text-xs text-slate-500 mt-1">完成率</div></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <h3 class="text-xs font-bold text-slate-500 uppercase mb-3">学生成绩</h3>
        <div id="student-progress" class="space-y-2 text-sm"></div>
      </div>
    </div>
  </div>
</main>
</div>

<!-- Slide-in Drawer -->
<div class="fixed top-0 right-0 h-full w-[460px] bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col" id="course-drawer">
  <div class="flex-none flex items-center justify-between px-6 py-4 border-b border-slate-200">
    <h3 class="text-base font-bold text-slate-800" id="drawer-title">课程详情</h3>
    <button class="p-1 text-slate-400 hover:bg-slate-100 rounded-lg" onclick="my_closeDrawer()"><iconify-icon class="text-xl" icon="lucide:x"></iconify-icon></button>
  </div>
  <div class="flex-1 overflow-y-auto p-6" id="drawer-body"></div>
  <div class="flex-none p-4 border-t border-slate-100 flex gap-2">
    <button class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg text-sm" onclick="my_closeDrawer()">关闭</button>
  </div>
</div>
<div class="fixed inset-0 bg-black/30 z-30 hidden" id="drawer-overlay" onclick="my_closeDrawer()"></div>

<!-- MODALS -->
<!-- Create Class -->
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40" id="modal-class">
  <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl" onclick="event.stopPropagation()">
    <h3 class="font-bold text-lg mb-4">创建班级</h3>
    <div class="space-y-4">
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">班级名称</label><input class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm" id="input-class-name" placeholder="如：大数据一班"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">班级码</label><input class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm mono bg-slate-50" id="input-class-code" readonly></div>
    </div>
    <div class="mt-6 flex gap-3 justify-end">
      <button class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 rounded-lg" onclick="my_closeModal('modal-class')">取消</button>
      <button class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700" onclick="my_createClass()">创建</button>
    </div>
  </div>
</div>

<!-- Create Course (with AI) -->
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40" id="modal-course">
  <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl" onclick="event.stopPropagation()">
    <div class="flex-none p-6 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-slate-800 text-lg" id="modal-course-title">创建实训课程</h3>
      <button class="text-slate-400 hover:text-slate-600" onclick="my_closeModal('modal-course')"><iconify-icon class="text-xl" icon="lucide:x"></iconify-icon></button>
    </div>
    <div class="flex-1 overflow-y-auto p-6 space-y-5">
      <!-- AI 辅助区 -->
      <div class="bg-violet-50 rounded-xl p-5 border border-violet-200" id="ai-assist-area">
        <div class="flex items-center gap-2 mb-3">
          <iconify-icon class="text-violet-500" icon="lucide:sparkles"></iconify-icon>
          <span class="text-sm font-bold text-violet-700">AI 辅助生成</span>
        </div>
        <p class="text-xs text-violet-600 mb-3">描述您想创建的实训任务，AI 将自动填充课程名称、简介和子任务清单。</p>
        <textarea class="w-full px-3 py-2.5 bg-white border border-violet-200 rounded-xl text-sm focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-100 resize-none" id="input-ai-prompt" placeholder="例如：利用Hive对淘宝用户日志进行多维度分析" rows="2"></textarea>
        <div class="flex items-center gap-2 mt-2">
          <input type="file" id="input-ai-file" class="hidden" onchange="ai_onFileChange(this)">
          <button class="px-3 py-1.5 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg hover:bg-amber-100" onclick="document.getElementById('input-ai-file').click()"><iconify-icon icon="lucide:file-up" class="mr-1 align-middle"></iconify-icon>上传数据文件</button>
          <span class="text-xs text-slate-400" id="ai-file-name">未选择文件</span>
        </div>
        <button class="mt-3 w-full py-2.5 bg-violet-600 text-white text-sm font-semibold rounded-lg hover:bg-violet-700 flex items-center justify-center gap-2" id="btn-ai-generate" onclick="aiGenerateCourse()"><iconify-icon icon="lucide:sparkles" style="pointer-events:none"></iconify-icon> AI 生成实训大纲</button>
        <div class="hidden mt-3 bg-white rounded-xl border border-slate-200 p-4 max-h-60 overflow-y-auto" id="ai-preview-box"><div class="text-xs text-slate-600 leading-relaxed" id="ai-preview-content"></div></div>
      </div>
      <div class="border-t border-slate-100"></div>
      <!-- Basic info -->
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">课程名称 <span class="text-red-400">*</span></label><input class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100" id="input-course-name" placeholder="如：Hive 数据分析实战"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">课程描述</label><textarea class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 resize-none" id="input-course-desc" rows="2"></textarea></div>
      <label class="flex items-center gap-2"><input type="checkbox" id="input-is-public" class="rounded"> <span class="text-sm text-slate-600">全站公开</span></label>
    </div>
    <div class="flex-none p-4 border-t border-slate-100 flex justify-end gap-3">
      <button class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 rounded-lg" onclick="my_closeModal('modal-course')">取消</button>
      <button class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700" onclick="my_saveCourse()">保存</button>
    </div>
  </div>
</div>

<!-- Profile Modal -->
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40" id="modal-profile">
  <div class="bg-white rounded-2xl w-full max-w-md p-8 shadow-2xl" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-bold text-lg text-slate-800">个人信息</h3>
      <button class="text-slate-400 hover:text-slate-600" onclick="my_closeModal('modal-profile')"><iconify-icon icon="lucide:x" class="text-xl"></iconify-icon></button>
    </div>
    <div class="flex justify-center mb-6">
      <div class="w-20 h-20 rounded-full bg-indigo-100 flex items-center justify-center text-2xl font-bold text-indigo-600" id="profile-avatar">教</div>
    </div>
    <div class="space-y-4">
      <div><label class="block text-xs font-semibold text-slate-500 mb-1">姓名</label><input class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 outline-none" id="profile-name"></div>
      <div><label class="block text-xs font-semibold text-slate-500 mb-1">性别</label><select class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:border-indigo-400 outline-none" id="profile-gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
      <div><label class="block text-xs font-semibold text-slate-500 mb-1">学校</label><input class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 outline-none" id="profile-school"></div>
      <div><label class="block text-xs font-semibold text-slate-500 mb-1">邮箱</label><input class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 outline-none" id="profile-email" placeholder="teacher@example.com" type="email"></div>
      <div><label class="block text-xs font-semibold text-slate-500 mb-1">工号</label><input class="w-full px-3 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-sm text-slate-500" id="profile-tid" readonly></div>
    </div>
    <div class="mt-6 flex gap-3 justify-end">
      <button class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 rounded-lg" onclick="my_closeModal('modal-profile')">取消</button>
      <button class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700" onclick="my_saveProfile()">保存</button>
    </div>
  </div>
</div>

<script>
var my_classes = [];
var my_allCourses = [];
var my_classId = null;
var my_currentCourseId = null;

// ===== INIT =====
window.addEventListener('DOMContentLoaded', function() {
  var user = API.getCurrentUser();
  if (!user) { window.location.href = 'login.html'; return; }
  var name = user.display_name || user.username || '教师';
  document.getElementById('teacher-name').innerText = name;
  document.getElementById('teacher-avatar').innerText = name.charAt(0).toUpperCase();
  document.getElementById('menu-fullname').innerText = name;
  document.getElementById('menu-role').innerText = user.role === 'teacher' ? '教师' : '学生';
  document.getElementById('menu-tid').innerText = '工号: ' + (user.teacher_id || '—');
  // Load profile from API
  apiFetch('/auth/profile').then(function(p) {
    if (p.display_name) {
      document.getElementById('teacher-name').innerText = p.display_name;
      document.getElementById('teacher-avatar').innerText = p.display_name.charAt(0).toUpperCase();
      document.getElementById('menu-fullname').innerText = p.display_name;
    }
    document.getElementById('menu-tid').innerText = '工号: ' + (p.teacher_id || user.teacher_id || '—');
  }).catch(function(){});
  my_load();
});

function my_toggleMenu() { document.getElementById('teacher-menu').classList.toggle('hidden'); }

function my_showProfile() {
  document.getElementById('teacher-menu').classList.add('hidden');
  apiFetch('/auth/profile').then(function(p) {
    document.getElementById('profile-name').value = p.display_name || document.getElementById('teacher-name').innerText;
    document.getElementById('profile-gender').value = p.gender || '';
    document.getElementById('profile-school').value = p.school || '';
    document.getElementById('profile-email').value = p.email || '';
    document.getElementById('profile-tid').value = p.teacher_id || (API.getCurrentUser()||{}).teacher_id || '';
    document.getElementById('profile-avatar').innerText = (p.display_name || '教').charAt(0).toUpperCase();
    document.getElementById('modal-profile').classList.remove('hidden');
  }).catch(function() {
    document.getElementById('profile-name').value = document.getElementById('teacher-name').innerText;
    document.getElementById('profile-tid').value = (API.getCurrentUser()||{}).teacher_id || '';
    document.getElementById('modal-profile').classList.remove('hidden');
  });
}

async function my_saveProfile() {
  var body = {
    display_name: document.getElementById('profile-name').value.trim(),
    gender: document.getElementById('profile-gender').value,
    school: document.getElementById('profile-school').value.trim(),
    email: document.getElementById('profile-email').value.trim()
  };
  await apiFetch('/auth/profile', { method: 'PUT', body: JSON.stringify(body) });
  document.getElementById('teacher-name').innerText = body.display_name;
  document.getElementById('teacher-avatar').innerText = body.display_name.charAt(0).toUpperCase();
  document.getElementById('menu-fullname').innerText = body.display_name;
  my_closeModal('modal-profile');
}

function my_logout() {
  apiFetch('/auth/logout', { method: 'POST' }).finally(function() {
    localStorage.removeItem('datatutor_token');
    localStorage.removeItem('datatutor_user');
    window.location.href = 'login.html';
  });
}

// Click outside to close menu
document.addEventListener('click', function(e) {
  var m = document.getElementById('teacher-menu');
  var w = document.getElementById('teacher-menu-wrap');
  if (m && !m.classList.contains('hidden') && !w.contains(e.target)) m.classList.add('hidden');
});

async function my_load() {
  try {
    var cr = await API.getClassList();
    my_classes = cr.classes || [];
    my_renderSidebar();
    var ar = await API.getCourses('teacher');
    my_allCourses = Array.isArray(ar) ? ar : (ar.courses || []);
  } catch(e) { console.error(e); }
}

// ===== SIDEBAR =====

async function my_selectClass(id) {  my_classId = id;  document.getElementById('empty-state').classList.add('hidden');  document.getElementById('detail-panel').classList.remove('hidden');  my_renderSidebar();  try {    var r = await API.getClassCourses(id);    my_renderClassCourses(r.courses || []);  } catch(e) { console.error(e); }}

function my_renderSidebar() {
  var list = document.getElementById('class-list');
  if (!list) return;
  list.innerHTML = '';
  my_classes.forEach(function(c) {
    var d = document.createElement('div');
    d.className = 'p-3 rounded-xl border cursor-pointer border-transparent hover:bg-slate-50';
    d.onclick = function() { my_selectClass(c.id); };
    d.innerHTML = '<div class="flex justify-between"><span class="text-sm font-semibold text-slate-700 truncate">'+c.name+'</span><button class="text-slate-400 hover:text-red-500 text-xs" onclick="event.stopPropagation();my_deleteClass('+c.id+',\''+c.name+'\')">&times;</button></div><div class="text-xs text-slate-400 mt-0.5">'+c.class_code+'</div>';
    list.appendChild(d);
  });
  if (!my_classes.length) list.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">暂无班级，点击 + 创建</p>';
}

async function my_deleteClass(id, name) {
  if (!confirm('删除班级 '+name+'？')) return;
  await API.deleteClass(id);
  my_classes = my_classes.filter(function(c){return c.id!=id;});
  if (my_classId == id) { my_classId = null; document.getElementById('detail-panel').classList.add('hidden'); document.getElementById('empty-state').classList.remove('hidden'); document.getElementById('empty-state').style.display = ''; }
  my_renderSidebar();
}

async function my_deleteCourse(cid, btn) {
  var card = btn.closest('[data-cname]');
  var cname = card ? card.dataset.cname : '该课程';
  if (!confirm('确定删除课程「'+cname+'」？\n将级联清理子任务、进度、对话、报告等数据，不可恢复。')) return;
  try {
    await API.deleteCourse(cid);
    toast('课程已删除', 'success');
    // 修复：同步从缓存 my_allCourses 中移除已删除课程，避免「分配课程」弹窗仍展示该条目
    my_allCourses = my_allCourses.filter(function(c){ return c.id !== cid; });
    // 刷新当前班级课程列表
    if (my_classId) {
      var cr = await API.getClassCourses(my_classId);
      my_renderClassCourses(cr.courses || []);
    }
  } catch(e) { toast('删除失败: ' + e.message, 'error'); }
}

// ===== SELECT CLASS =====

async function my_openCourse(courseId, courseName) {

    var html = tasks.length === 0 ? '<p class="text-slate-400 text-center py-8">暂无子任务，请先创建</p>' : '';

function my_showAssign() {
  if (!my_classId) return;
  var assigned = []; document.querySelectorAll('#class-courses-area span').forEach(function(s){ var m = s.onclick?.toString().match(/my_openCourse\((\d+)/); if (m) assigned.push(parseInt(m[1])); });
  var uid = (API.getCurrentUser() || {}).id;
  var html = '<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" onclick="this.remove()"><div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl" onclick="event.stopPropagation()"><h3 class="text-lg font-bold mb-4">分配课程</h3><div class="space-y-2 max-h-80 overflow-y-auto">';
  var cnt = 0;
  my_allCourses.forEach(function(c) {
    if (assigned.indexOf(c.id) >= 0) return;
    cnt++;
    // 归属权限标识：全站公开 / 待审核 / 我的课程
    var badge = '';
    if (c.is_public === 1) badge = '<span class="px-1.5 py-0.5 rounded text-[10px] bg-emerald-50 text-emerald-600">全站公开'+(c.teacher_name?' · '+c.teacher_name:'')+'</span>';
    else if (c.is_public === 2) badge = '<span class="px-1.5 py-0.5 rounded text-[10px] bg-amber-50 text-amber-600">待审核</span>';
    else badge = '<span class="px-1.5 py-0.5 rounded text-[10px] '+(c.teacher_id === uid ? 'bg-indigo-50 text-indigo-600' : 'bg-slate-100 text-slate-500')+'">'+(c.teacher_id === uid ? '我的课程' : '私有')+'</span>';
    html += '<div class="flex justify-between items-center p-2 border rounded hover:bg-slate-50"><span class="text-sm flex items-center gap-2">'+c.name+badge+'</span><button class="px-2 py-1 bg-indigo-500 text-white text-xs rounded" onclick="my_doAssign('+c.id+')\">添加</button></div>';
  });
  if (!cnt) html += '<p class="text-slate-400 text-sm text-center py-4">所有课程已分配</p>';
  html += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

async function my_saveCourse() {
  var name = document.getElementById('input-course-name').value.trim();
  var desc = document.getElementById('input-course-desc').value.trim();
  var pub = document.getElementById('input-is-public').checked;
  if (!name) return;
  var body = { name: name, description: desc, is_public: pub };
  if (window._aiSubtasks && window._aiSubtasks.length > 0) {
    body.subtasks = window._aiSubtasks.map(function(s) {
      return { name: s.name, command: s.command || '', expected_output: s.expected_output || '', knowledge_text: s.knowledge_text || '' };
    });
  }
  var res = await apiFetch('/courses', { method: 'POST', body: JSON.stringify(body) });
  my_closeModal('modal-course');
  // 勾选「全站公开」→ 提示已提交审核；未勾选 → 提示创建成功
  if (pub) { toast('已提交全站公开申请，等待管理员审核', 'success'); }
  else { toast('课程已创建', 'success'); }
  // 自动分配到当前班级
  if (my_classId && res && res.id) {
    try { await API.assignCourseToClass(my_classId, res.id); } catch(e) {}
  }
  // 刷新当前班级课程
  if (my_classId) {
    var cr = await API.getClassCourses(my_classId);
    my_renderClassCourses(cr.courses || []);
  }
  // 刷新可分配课程缓存（确保新建课程在「分配课程」弹窗中可见、状态正确）
  try {
    var ar2 = await API.getCourses('teacher');
    my_allCourses = Array.isArray(ar2) ? ar2 : (ar2.courses || []);
  } catch(e) {}
}

// ── AI 辅助生成 ──
var _aiFile = null;
function ai_onFileChange(input) {
  _aiFile = input.files[0];
  document.getElementById('ai-file-name').innerText = _aiFile ? _aiFile.name : '未选择文件';
}

async function aiGenerateCourse() {
  var prompt = document.getElementById('input-ai-prompt').value.trim();
  if (!prompt) { document.getElementById('input-ai-prompt').focus(); return; }
  var btn = document.getElementById('btn-ai-generate');
  btn.disabled = true;
  btn.innerHTML = '<div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> AI 生成中...';
  try {
    // 文件内容只取前10行拼入 prompt，不把整个文件发给后端（避免超 1MB 限制）
    var finalPrompt = prompt;
    if (_aiFile) {
      var fileText = await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsText(_aiFile.slice(0, 5000));  // 只读前 5KB
      });
      var lines = fileText.split('\n').slice(0, 10).join('\n');
      finalPrompt = '数据文件 ' + _aiFile.name + ' 预览（前10行）：\n' + lines + '\n\n课程主题：' + prompt;
    }
    var r = await fetch('/api/ai/generate-course', {
      method: 'POST',
      body: JSON.stringify({ prompt: finalPrompt }),
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (localStorage.getItem('datatutor_token') || '')
      }
    });
    if (!r.ok) { var e = await r.json().catch(function(){}); throw new Error((e&&e.error)||'AI 服务异常'); }
    var data = await r.json();
    document.getElementById('input-course-name').value = data.name || '';
    document.getElementById('input-course-desc').value = data.description || '';
    var subtasks = data.subtasks || [];
    if (subtasks.length > 0) {
      window._aiSubtasks = subtasks;
      var box = document.getElementById('ai-preview-box');
      var content = document.getElementById('ai-preview-content');
      content.innerHTML = '<div class=\"font-semibold text-sm mb-2 text-violet-700\">生成子任务 ('+subtasks.length+'项)：</div>' +
        subtasks.map(function(s,i){ return '<div class=\"text-xs text-slate-600 py-1 border-b border-slate-100 last:border-0\">'+(i+1)+'. '+s.name+' <code class=\"text-[10px] bg-slate-100 px-1 rounded\">'+(s.command||'')+'</code></div>'; }).join('');
      box.classList.remove('hidden');
    }
  } catch(e) {
    alert('AI 生成失败: ' + e.message);
  }
  btn.disabled = false;
  btn.innerHTML = '<iconify-icon icon=\"lucide:sparkles\" style=\"pointer-events:none\"></iconify-icon> AI 生成实训大纲';
}

async function my_loadAnalytics() {
  var cid = document.getElementById('analytics-course-select').value;
  if (!my_classId || !cid) return;
  my_currentCourseId = parseInt(cid);
  try {
    var d = await apiFetch('/analytics/class/'+my_classId+'?course_id='+my_currentCourseId);
    document.getElementById('ana-students').innerText = d.total_students||0;
    document.getElementById('ana-avg').innerText = d.avg_tasks||0;
    document.getElementById('ana-rate').innerText = (d.complete_rate||0)+'%';

    // Student progress + reports
    var pr = await API.getClassProgress(my_classId, my_currentCourseId);
    var students = pr.students || [];
    // Also get reports for this course
    var reportsMap = {};
    try {
      var rr = await apiFetch('/reports?course_id='+my_currentCourseId);
      (rr.reports||[]).forEach(function(r) { if (!reportsMap[r.student_id]) reportsMap[r.student_id] = r; });  // 只保留每个学生最新报告(desc最新在前, 2026-08-29 修旧报告覆盖)
    } catch(e) {}

    var sh = '';
    var grades = {'A':'bg-emerald-100 text-emerald-700','B':'bg-blue-100 text-blue-700','C':'bg-amber-100 text-amber-700','D':'bg-orange-100 text-orange-700','F':'bg-red-100 text-red-700'};
    students.forEach(function(s) {
      var pct = s.total > 0 ? Math.round(s.progress/s.total*100) : 0;
      var bc = pct >= 100 ? 'bg-emerald-500' : pct > 0 ? 'bg-indigo-500' : 'bg-slate-200';
      var rep = reportsMap[s.student_id];
      var gradeHtml = '';
      if (rep && rep.grade) {
        gradeHtml = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer hover:scale-110 transition-transform '+(grades[rep.grade]||'bg-slate-100 text-slate-600')+'" onclick="my_showReport('+s.student_id+')">'+rep.grade+'</span>';
      } else if (pct >= 100) {
        gradeHtml = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-purple-100 text-purple-600">待评</span>';
      }
      sh += '<div class="flex items-center gap-3 py-1 border-b border-slate-50 last:border-0"><span class="text-xs w-20 truncate font-medium">'+s.name+'</span><div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full '+bc+' rounded-full" style="width:'+pct+'%"></div></div><span class="text-xs text-slate-400 w-8 text-right">'+pct+'%</span>'+gradeHtml+'</div>';
    });
    document.getElementById('student-progress').innerHTML = sh || '<p class="text-slate-400 text-xs py-4">暂无学生</p>';
  } catch(e) { console.error(e); }
}

async function my_showReport(studentId) {
  var cid = document.getElementById('analytics-course-select').value;
  if (!studentId || !cid) return;
  document.getElementById('report-preview-title').innerText = '加载中...';
  document.getElementById('report-preview-content').innerHTML = '<p class="text-slate-400 text-center py-8">加载中...</p>';
  document.getElementById('modal-report-preview').classList.remove('hidden');
  try {
    var rr = await apiFetch('/reports/student/'+studentId);
    var reports = rr.reports || [];
    var rep = reports.find(function(r){ return r.course_id == cid; });
    if (rep && rep.content) {
      document.getElementById('report-preview-title').innerText = '实训报告';
      document.getElementById('report-preview-content').innerHTML = '<div style="white-space:pre-wrap">'+rep.content+'</div>';
    } else {
      document.getElementById('report-preview-content').innerHTML = '<p class="text-slate-400 text-center py-8">该学生暂无此课程的报告</p>';
    }
  } catch(e) {
    document.getElementById('report-preview-content').innerHTML = '<p class="text-red-400 text-center py-8">加载失败</p>';
  }
}
